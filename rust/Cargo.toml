[package]
name = "paw-ffi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "paw_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
accesskit = "0.25.1"
accesskit_winit = "0.34.1"
cosmic-text = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "c6b51a80e302cba9a8cc0db4141d1ef2717d7b0e", default-features = false, features = ["mimalloc"] }
softbuffer = "0.4"
tiny-skia = "0.11"
webbrowser = "1.2.5"
winit = "0.30"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_winit = { version = "0.34.1", features = ["accesskit_android"] }
android_clipboard = "0.1"
android_logger = "0.15"
jni = "0.21"
libc = "0.2"
log = "0.4"
winit = { version = "0.30", features = ["android-game-activity"] }

[profile.release]
panic = "abort"

[dev-dependencies]
benchmark = "0.8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

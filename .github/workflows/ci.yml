# SPDX-License-Identifier: AGPL-3.0-only

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELAN_VERSION: 4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -fsSLO "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: elan toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            rust/target
          key: build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust/Cargo.lock') }}
      - run: make test
      - run: make coverage
      - run: make goldens
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-actual
          path: tests/goldens/actual/
      - run: rustup component add clippy && make check

  e2e:
    runs-on: ubuntu-latest
    env:
      ELAN_VERSION: 4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@v4
      - name: install display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool xclip sway wtype \
            wl-clipboard jq libxkbcommon-x11-0
      - name: install elan
        run: |
          curl -fsSLO "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf elan-x86_64-unknown-linux-gnu.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: elan toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            rust/target
          key: build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust/Cargo.lock') }}
      - run: make e2e-x11
      - run: make e2e-wayland

[package]
name = "paw-ffi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "paw_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
cosmic-text = "0.14"
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "ac11ff152cc82bccd0ef18f45384ac5acb091260", default-features = false, features = ["mimalloc"] }
softbuffer = "0.4"
tiny-skia = "0.11"
winit = "0.30"

[profile.release]
panic = "abort"
